<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Bus Media Report</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f2f5; --surface: #fff; --border: #e4e6ea;
  --text: #1a1a2e; --muted: #6b7280;
  --green: #059669; --blue: #1d4ed8; --orange: #d97706; --red: #dc2626;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  padding: 16px 20px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100;
}
.logo { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg,#3b82f6,#1d4ed8); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex-shrink:0; }
.header h1 { font-size: 16px; font-weight: 700; color: #fff; }
.header p  { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 1px; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.updated-at { font-size: 11px; color: rgba(255,255,255,0.4); white-space: nowrap; }
.refresh-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 8px; padding: 7px 12px; font-size: 12px; font-family: 'Sarabun',sans-serif; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.refresh-btn:active { opacity: 0.75; }
.refresh-btn.loading i { animation: spin .7s linear infinite; }

/* Period tabs */
.period-bar { background: #fff; border-bottom: 1px solid var(--border); padding: 0 14px; display: flex; gap: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.period-tab { padding: 12px 18px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2.5px solid transparent; white-space: nowrap; font-family: 'Sarabun',sans-serif; background: none; border-top: none; border-left: none; border-right: none; transition: color .15s; }
.period-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.period-tab:active { opacity: .75; }

.page { max-width: 720px; margin: 0 auto; padding: 14px 12px 48px; }

/* Stat cards */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; }
.stat-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
.stat-label i { font-size: 14px; }
.stat-num { font-size: 36px; font-weight: 800; line-height: 1; }
.stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.c-green  { color: var(--green); }
.c-blue   { color: var(--blue); }
.c-orange { color: var(--orange); }
.c-gray   { color: #374151; }

/* Section */
.section-label {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin: 18px 0 8px 4px; display: flex; align-items: center; gap: 6px;
}
.section-label::before { content:''; width:3px; height:12px; background:var(--blue); border-radius:2px; }

/* Status cards */
.status-row { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-bottom: 16px; }
.status-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 14px 16px; }
.status-card .lbl { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.status-card .num { font-size: 28px; font-weight: 800; line-height: 1; }
.status-card .pct { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Bar chart */
.bar-block { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 14px 16px; margin-bottom: 10px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-name { font-size: 13px; font-weight: 600; width: 120px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { flex: 1; background: #f1f5f9; border-radius: 100px; height: 10px; overflow: hidden; }
.bar-fill  { height: 100%; border-radius: 100px; background: var(--blue); transition: width .4s ease; }
.bar-count { font-size: 13px; font-weight: 700; color: var(--text); width: 28px; text-align: right; flex-shrink: 0; }

/* Recent jobs */
.job-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
.job-top  { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.job-plate { font-size: 18px; font-weight: 800; color: var(--green); letter-spacing: .5px; }
.job-status { font-size: 12px; font-weight: 700; }
.job-mid  { font-size: 13px; color: #374151; margin-bottom: 3px; }
.job-bot  { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

.empty-msg { text-align: center; padding: 24px; color: var(--muted); font-size: 14px; }
.spinner-wrap { display: flex; justify-content: center; align-items: center; padding: 60px; }
.spinner { width: 28px; height: 28px; border: 3px solid #e0e0e0; border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-msg { text-align: center; padding: 40px; color: var(--red); font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">PB</div>
  <div>
    <h1>Dashboard</h1>
    <p>Bus Media Report · Plan B Media</p>
  </div>
  <div class="header-right">
    <span class="updated-at" id="updatedAt"></span>
    <button class="refresh-btn" id="refreshBtn" onclick="loadDashboard()"><i class="ti ti-refresh"></i> รีเฟรช</button>
  </div>
</div>

<div class="period-bar">
  <button class="period-tab active" onclick="setPeriod('today',this)">วันนี้</button>
  <button class="period-tab" onclick="setPeriod('week',this)">สัปดาห์นี้</button>
  <button class="period-tab" onclick="setPeriod('month',this)">เดือนนี้</button>
  <button class="period-tab" onclick="setPeriod('all',this)">ทั้งหมด</button>
</div>

<div class="page" id="dashPage">
  <div class="spinner-wrap"><div class="spinner"></div></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-ydb5wIKHXNT15oKpginu6UcJ3obv0lMQktV23DwCAQREx-o0CWAkOgqo5rpUlUkS/exec';

let allData = null;
let currentPeriod = 'today';

function stColor(s) {
  return s==='งานเสร็จปกติ'?'#059669':s==='งานเสร็จไม่รับงาน'?'#d97706':s==='เปลี่ยนคัน'?'#1d4ed8':'#dc2626';
}
function stIcon(s) {
  return s==='งานเสร็จปกติ'?'✅':s==='งานเสร็จไม่รับงาน'?'⚠️':s==='เปลี่ยนคัน'?'🔄':'❌';
}

function setPeriod(period, btn) {
  currentPeriod = period;
  document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  if (allData) renderWithPeriod(allData);
}

function filterRows(rows, period) {
  if (period === 'all' || !rows) return rows || [];
  const now   = Date.now();
  const d     = new Date(); d.setHours(0,0,0,0);
  const today = d.getTime();
  const weekAgo  = today - 6 * 86400000;
  const monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();
  return rows.filter(r => {
    const ts = r.ts;
    if (!ts) return false;
    if (period === 'today') return ts >= today;
    if (period === 'week')  return ts >= weekAgo;
    if (period === 'month') return ts >= monthStart;
    return true;
  });
}

function aggregate(rows) {
  const byStatus = {}, byDepot = {}, byMedia = {};
  rows.forEach(r => {
    if (r.status) byStatus[r.status] = (byStatus[r.status]||0) + 1;
    if (r.depot)  byDepot[r.depot]   = (byDepot[r.depot]||0)  + 1;
    if (r.media)  byMedia[r.media]   = (byMedia[r.media]||0)  + 1;
  });
  const depotList = Object.entries(byDepot).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([name,count])=>({name,count}));
  const mediaList = Object.entries(byMedia).map(([name,count])=>({name,count}));
  return { byStatus, depotList, mediaList };
}

function renderWithPeriod(d) {
  const filtered = filterRows(d.rows, currentPeriod);
  const total    = filtered.length;
  const { byStatus, depotList, mediaList } = aggregate(filtered);

  const finish = (byStatus['งานเสร็จปกติ']||0) + (byStatus['งานเสร็จไม่รับงาน']||0);
  const swap   = byStatus['เปลี่ยนคัน'] || 0;
  const cancel = byStatus['ยกเลิก']     || 0;
  const pct    = n => total > 0 ? Math.round(n/total*100) + '%' : '0%';

  const maxDepot = depotList.length > 0 ? depotList[0].count : 1;
  const MEDIA_COLORS = {'BusWrap':'#1d4ed8','MuvAds':'#7c3aed','NCA_Bus':'#059669'};
  const maxMedia = mediaList.length > 0 ? Math.max(...mediaList.map(m=>m.count)) : 1;

  const depotBars = depotList.map(dep => `
    <div class="bar-row">
      <div class="bar-name" title="${dep.name}">${dep.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(dep.count/maxDepot*100)}%"></div></div>
      <div class="bar-count">${dep.count}</div>
    </div>`).join('') || '<p class="empty-msg">ไม่มีข้อมูล</p>';

  const mediaBars = mediaList.map(m => `
    <div class="bar-row">
      <div class="bar-name">${m.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(m.count/maxMedia*100)}%;background:${MEDIA_COLORS[m.name]||'#374151'}"></div></div>
      <div class="bar-count">${m.count}</div>
    </div>`).join('') || '<p class="empty-msg">ไม่มีข้อมูล</p>';

  const recent = filtered.slice(0, 15).reverse().map(j => `
    <div class="job-card">
      <div class="job-top">
        <span class="job-plate">${j.plate}</span>
        <span class="job-status" style="color:${stColor(j.status)}">${stIcon(j.status)} ${j.status}</span>
      </div>
      <div class="job-mid">${j.product} · ${j.media}</div>
      <div class="job-bot">
        <span>${j.tech} · ${j.depot}</span>
        <span>${j.date} ${j.folder?'<a href="'+j.folder+'" target="_blank" style="color:#1d4ed8">📁</a>':''}</span>
      </div>
    </div>`).join('') || '<p class="empty-msg">ไม่มีงานในช่วงนี้</p>';

  document.getElementById('dashPage').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-list-check c-blue"></i>งานทั้งหมด</div>
        <div class="stat-num c-blue">${total}</div>
        <div class="stat-sub">ในช่วงที่เลือก</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-circle-check c-green"></i>งานเสร็จ</div>
        <div class="stat-num c-green">${finish}</div>
        <div class="stat-sub">${pct(finish)} ของช่วงนี้</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-arrows-exchange c-blue"></i>เปลี่ยนคัน</div>
        <div class="stat-num" style="color:#1d4ed8">${swap}</div>
        <div class="stat-sub">${pct(swap)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-x" style="color:var(--red)"></i>ยกเลิก</div>
        <div class="stat-num" style="color:var(--red)">${cancel}</div>
        <div class="stat-sub">${pct(cancel)}</div>
      </div>
    </div>

    <div class="section-label">สถานะงาน</div>
    <div class="status-row">
      <div class="status-card">
        <div class="lbl">✅ งานเสร็จปกติ</div>
        <div class="num" style="color:#059669">${byStatus['งานเสร็จปกติ']||0}</div>
        <div class="pct">${pct(byStatus['งานเสร็จปกติ']||0)}</div>
      </div>
      <div class="status-card">
        <div class="lbl">⚠️ ไม่รับงาน</div>
        <div class="num" style="color:#d97706">${byStatus['งานเสร็จไม่รับงาน']||0}</div>
        <div class="pct">${pct(byStatus['งานเสร็จไม่รับงาน']||0)}</div>
      </div>
      <div class="status-card">
        <div class="lbl">🔄 เปลี่ยนคัน</div>
        <div class="num" style="color:#1d4ed8">${swap}</div>
        <div class="pct">${pct(swap)}</div>
      </div>
      <div class="status-card">
        <div class="lbl">❌ ยกเลิก</div>
        <div class="num" style="color:#dc2626">${cancel}</div>
        <div class="pct">${pct(cancel)}</div>
      </div>
    </div>

    <div class="section-label">อู่ที่ active (Top 10)</div>
    <div class="bar-block">${depotBars}</div>

    <div class="section-label">Media Type</div>
    <div class="bar-block">${mediaBars}</div>

    <div class="section-label">งานล่าสุด 15 รายการ</div>
    ${recent}
  `;
}

function loadDashboard() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');
  document.getElementById('dashPage').innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  fetch(SCRIPT_URL + '?action=dashboard', { redirect: 'follow' })
    .then(r => r.json())
    .then(d => {
      btn.classList.remove('loading');
      if (d.status !== 'ok') { document.getElementById('dashPage').innerHTML = '<p class="error-msg">เกิดข้อผิดพลาด กรุณา Deploy Code.gs ใหม่</p>'; return; }
      document.getElementById('updatedAt').textContent = 'อัปเดต ' + (d.updatedAt || '');
      allData = d;
      renderWithPeriod(d);
    })
    .catch(() => {
      btn.classList.remove('loading');
      document.getElementById('dashPage').innerHTML = '<p class="error-msg">โหลดไม่ได้ ตรวจสอบการเชื่อมต่อแล้วลองใหม่</p>';
    });
}

loadDashboard();
</script>
</body>
</html>
